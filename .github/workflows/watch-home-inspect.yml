name: Inspect watch home source
on:
  push:
    branches: [ "watch-recording-button-20261026" ]
    paths:
      - "watch-home-src/**"
      - ".github/workflows/watch-home-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat watch-home-src/chunk-* > /tmp/reconstruct-watch.sh
          bash /tmp/reconstruct-watch.sh
          find project -maxdepth 8 -type f | sort | head -250
      - name: Find PTT button
        shell: bash
        run: |
          set -euo pipefail
          echo "=== MATCHES ==="
          grep -R -n -C 20 "押して話す" project || true
          echo "=== PACKAGE ==="
          grep -R -n "applicationId\|namespace\|versionCode\|versionName" project --include='*.gradle*' || true
          echo "=== SIGNING ==="
          grep -R -n "signingConfig\|storeFile\|keyAlias" project --include='*.gradle*' || true
