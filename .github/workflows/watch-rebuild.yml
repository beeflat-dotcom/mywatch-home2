name: Rebuild current watch source
on:
  push:
    branches: [ "watch-recording-button-20261026" ]
    paths:
      - "watch-current-decompiled/**"
      - ".github/workflows/watch-rebuild.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare source project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf watch-current-src
          mkdir -p watch-current-src/app/src/main/java/jp/beeflat/watchhomeptt
          cp watch-current-decompiled/java/*.java watch-current-src/app/src/main/java/jp/beeflat/watchhomeptt/
          mkdir -p watch-current-src/app/src/main/res/xml
          cp watch-current-decompiled/res/xml/update_paths.xml watch-current-src/app/src/main/res/xml/update_paths.xml
          cp watch-current-decompiled/AndroidManifest.xml watch-current-src/app/src/main/AndroidManifest.xml
          sed -i 's/android:versionCode="10"/android:versionCode="11"/' watch-current-src/app/src/main/AndroidManifest.xml
          sed -i 's/android:versionName="0.1.9"/android:versionName="0.1.10"/' watch-current-src/app/src/main/AndroidManifest.xml
          cat > watch-current-src/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='BeeWatchHomePTT'
          include ':app'
          EOF
          cat > watch-current-src/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > watch-current-src/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'jp.beeflat.watchhomeptt'
            compileSdk 35
            defaultConfig {
              applicationId 'jp.beeflat.watchhomeptt'
              minSdk 27
              targetSdk 28
              versionCode 11
              versionName '0.1.10'
            }
            buildFeatures { buildConfig true }
          }
          dependencies {
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'androidx.core:core:1.15.0'
          }
          EOF
          cat > watch-current-src/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF
      - name: Compile reconstructed source
        working-directory: watch-current-src
        shell: bash
        run: gradle :app:assembleDebug --stacktrace
