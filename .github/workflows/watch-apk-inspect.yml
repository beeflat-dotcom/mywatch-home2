name: Inspect current watch APK
on:
  push:
    branches: [ "watch-recording-button-20261026" ]
    paths:
      - ".github/workflows/watch-apk-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jadx
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/skylot/jadx/releases/latest
          url=$(curl -fsSL "$api" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["browser_download_url"] for x in d["assets"] if x["name"].endswith(".zip") and "jadx-" in x["name"]))')
          curl -fsSL "$url" -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile APK
        shell: bash
        run: |
          set -euo pipefail
          /tmp/jadx/bin/jadx -d /tmp/watch-dec downloads/bee-home-ptt-v0.1.9.apk >/tmp/jadx.log 2>&1 || true
          echo "=== PACKAGE FILES ==="
          find /tmp/watch-dec/sources/jp/beeflat/watchhomeptt -maxdepth 1 -type f -printf '%f\n' | sort
          echo "=== PTT SERVICE AUDIO ==="
          grep -n -C 25 "AudioRecord\|TALK_START\|TALK_STOP\|WebSocket\|send" /tmp/watch-dec/sources/jp/beeflat/watchhomeptt/PttService.java | head -700 || true
          echo "=== MANIFEST ==="
          sed -n '1,260p' /tmp/watch-dec/resources/AndroidManifest.xml
