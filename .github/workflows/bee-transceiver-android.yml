name: BeeTransceiver Android compile check
on:
  push:
    branches: [ "bee-transceiver-v0.6-background" ]
    paths:
      - "transceiver/android/**"
      - ".github/workflows/bee-transceiver-android.yml"
  pull_request:
    paths:
      - "transceiver/android/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        working-directory: transceiver/android
        env:
          BEE_AUDIO_TOKEN: ""
        run: gradle :app:assembleDebug --stacktrace
