name: BeeTransceiver Android compile check
on:
  push:
    branches: [ "main", "bee-transceiver-v0.6-background", "bee-transceiver-v0.6-final" ]
    paths:
      - "transceiver/android/**"
      - ".github/workflows/bee-transceiver-android.yml"
      - "downloads/BeeClip.apk.hex"
  pull_request:
    paths:
      - "transceiver/android/**"
      - ".github/workflows/bee-transceiver-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        working-directory: transceiver/android
        env:
          BEE_AUDIO_TOKEN: ""
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BeeTransceiver-v0.6.1-debug
          path: transceiver/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


  publish-beeclip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore BeeClip APK
        run: xxd -r -p downloads/BeeClip.apk.hex > BeeClip.apk
      - name: Verify BeeClip APK
        run: unzip -t BeeClip.apk
      - name: Publish BeeClip APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beeclip-latest --yes --cleanup-tag || true
          gh release create beeclip-latest BeeClip.apk --title "BeeClip Android" --notes "Direct Android APK download"
