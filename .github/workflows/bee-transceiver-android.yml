name: BeeTransceiver Android compile check
on:
  push:
    branches: [ "bee-transceiver-v0.6-background", "bee-transceiver-v0.6-final", "bee-apk-build-20261022" ]
    paths:
      - "transceiver/android/**"
      - ".github/workflows/bee-transceiver-android.yml"
  pull_request:
    paths:
      - "transceiver/android/**"
      - ".github/workflows/bee-transceiver-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        working-directory: transceiver/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BeeTransceiver-v0.6.0-debug
          path: transceiver/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
