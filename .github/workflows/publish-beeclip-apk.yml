name: Publish BeeClip APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "downloads/BeeClip.apk.hex"
      - ".github/workflows/publish-beeclip-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore APK
        run: |
          xxd -r -p downloads/BeeClip.apk.hex downloads/BeeClip.apk
          test "$(head -c 2 downloads/BeeClip.apk)" = "PK"
          test "$(stat -c%s downloads/BeeClip.apk)" -eq 31900
      - name: Upload BeeClip APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeeClip-APK
          path: downloads/BeeClip.apk
          retention-days: 1

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/BeeClip.apk
          git commit -m "Publish BeeClip APK" || exit 0
          git push
