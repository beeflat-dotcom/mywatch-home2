plugins { id 'com.android.application' }

def beeToken=(project.findProperty('BEE_AUDIO_TOKEN') ?: System.getenv('BEE_AUDIO_TOKEN') ?: 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX').toString()
def quotedToken='"' + beeToken.replace('\\','\\\\').replace('"','\\"') + '"'

android {
    namespace 'jp.beeflat.beetransceiver'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.beeflat.beetransceiver'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.6.0'
        buildConfigField 'String','BEE_AUDIO_TOKEN',quotedToken
        buildConfigField 'String','BEE_ENDPOINT_DISCOVERY_URL','"https://raw.githubusercontent.com/beeflat-dotcom/mywatch-home2/main/bee-audio/audio_external_api.json"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'
        }
    }
}
