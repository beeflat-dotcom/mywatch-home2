<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>びーアプリストア</title><style>body{font-family:sans-serif;background:#fff8e5;color:#24313c;max-width:440px;margin:48px auto;padding:20px}main{background:white;border-radius:18px;padding:24px}button{padding:12px;width:100%;background:#ffcf48;border:0;border-radius:8px;font-size:16px}p{line-height:1.7}</style><main><h1>びーアプリストア</h1><p id="status">現在の配布サーバーに接続しています…</p><button id="retry" hidden>再接続</button></main><script>async function go(){const s=document.getElementById("status"),b=document.getElementById("retry");b.hidden=true;s.textContent="現在の配布サーバーに接続しています…";try{const r=await fetch("https://raw.githubusercontent.com/beeflat-dotcom/mywatch-home2/main/bee-monitor/monitor_external_api.json?t="+Date.now(),{cache:"no-store",credentials:"omit"});if(!r.ok)throw Error();const j=await r.json();if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(j.external_api_url))throw Error();location.replace(j.external_api_url+"/bee-store/setup");}catch(e){s.textContent="配布サーバーの接続先を取得できません。再接続してください。";b.hidden=false;}}document.getElementById("retry").onclick=go;go();</script></html>
